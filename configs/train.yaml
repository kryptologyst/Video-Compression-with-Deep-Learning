# Training configuration for video compression
model:
  type: "video_autoencoder"  # Options: video_autoencoder, temporal_autoencoder, hyperprior
  input_channels: 3
  latent_channels: 64
  num_residual_blocks: 4
  temporal_kernel_size: 3
  hyperprior_channels: 32

data:
  data_dir: "data/raw"
  frame_size: [224, 224]
  sequence_length: 8
  max_frames: null
  num_workers: 4

training:
  batch_size: 8
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 1e-4
  patience: 10
  early_stopping_patience: 20
  
  loss:
    type: "compression"
    lambda_mse: 1.0
    lambda_perceptual: 0.1
    lambda_rate: 0.01

logging:
  log_dir: "logs/tensorboard"
  checkpoint_dir: "checkpoints"
  use_wandb: false
  project_name: "video-compression"

seed: 42
